<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ارتباط با اینترنت برقرار نیست</title>
    <style>
      :root { color-scheme: light; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f8fafc;
        color: #0f172a;
        font-family: Vazirmatn, system-ui, -apple-system, "Segoe UI", sans-serif;
        text-align: center;
        padding: 1.5rem;
      }
      main { max-width: 26rem; }
      .badge {
        width: 4.5rem;
        height: 4.5rem;
        margin: 0 auto 1.25rem;
        border-radius: 1.25rem;
        background: #dbe1ff;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      h1 { font-size: 1.25rem; margin: 0 0 0.5rem; }
      p { margin: 0 0 1.5rem; color: #475569; font-size: 0.95rem; line-height: 1.9; }
      a {
        display: inline-block;
        background: #2563eb;
        color: #fff;
        text-decoration: none;
        font-weight: 700;
        padding: 0.7rem 1.5rem;
        border-radius: 0.9rem;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="badge">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#2563eb"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M1 1l22 22" />
          <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55" />
          <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39" />
          <path d="M10.71 5.05A16 16 0 0 1 22.58 9" />
          <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88" />
          <path d="M8.53 16.11a6 6 0 0 1 6.95 0" />
          <line x1="12" y1="20" x2="12.01" y2="20" />
        </svg>
      </div>
      <h1>ارتباط با اینترنت برقرار نیست</h1>
      <p>
        برای دیدن اطلاعات و ثبت داده‌های جدید، به اینترنت وصل شوید.
        اطلاعاتی که قبلا روی همین دستگاه ذخیره شده همچنان در دسترس است.
      </p>
      <a href="/">تلاش دوباره</a>
    </main>
  </body>
</html>
